name: Release

on:
  push:
    tags: ['v0.*.*', 'v[1-9]*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow
      - name: Verify version and tag
        shell: bash
        run: |
          python scripts/sync_version.py --check
          python scripts/check_license.py
          test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
      - run: node JSCanvasEdition/tests.mjs
      - run: python -m unittest test_assets.py
        working-directory: JSCanvasEdition
      - name: Package source and release notes
        shell: bash
        run: |
          mkdir -p dist
          archive="Nocturne-JSCanvasEdition-${GITHUB_REF_NAME}.zip"
          git archive --format=zip --output="dist/$archive" HEAD JSCanvasEdition VERSION VERSIONING.md README.md CONTRIBUTING.md LICENSE NOTICE scripts
          (cd dist && sha256sum "$archive" > SHA256SUMS.txt)
          python - <<'PY'
          import os, re
          from pathlib import Path
          from urllib.parse import urljoin
          tag = os.environ['GITHUB_REF_NAME']
          text = Path('JSCanvasEdition/RELEASES.md').read_text()
          match = re.search(r'^## ' + re.escape(tag) + r'(?:\s|$).*?(?=^## v\d|\Z)', text, re.M | re.S)
          if not match:
              raise SystemExit('Missing release notes for ' + tag)
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{tag}/JSCanvasEdition/"
          notes = re.sub(r'\]\((?!https?://|#)([^)]+)\)', lambda m: '](' + urljoin(base, m.group(1)) + ')', match.group().strip())
          notes += '\n\nDownload the ZIP below, extract it and open `JSCanvasEdition/index.html`. Verify the archive with `SHA256SUMS.txt`.\n'
          Path('dist/notes.md').write_text(notes, encoding='utf-8')
          PY
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag --title "Nocturne JSCanvasEdition $GITHUB_REF_NAME" \
            --notes-file dist/notes.md --latest
